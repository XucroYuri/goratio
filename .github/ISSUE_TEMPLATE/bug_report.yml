name: 缺陷报告
description: 报告可复现的程序错误、崩溃或输出契约问题。
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请移除凭据、真实缓存和无权公开的数据；安全漏洞请改用私有报告入口。
  - type: input
    id: version
    attributes:
      label: goratio 版本
      description: 请粘贴 `goratio --version` 的输出或提交 SHA。
      placeholder: goratio 0.1.0rc1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统和 `python --version` 输出。
      placeholder: macOS 15 / Python 3.13.7
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 数据来源
      options:
        - cn_public
        - yahoo_futures
        - user_csv
        - 与数据来源无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 给出命令和最小输入描述，不要上传无再分发权的数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可粘贴已脱敏的错误输出或 JSON 片段。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是公开安全漏洞。
          required: true
        - label: 我已移除凭据、个人信息和无权公开的第三方数据。
          required: true
