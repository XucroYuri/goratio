[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "goratio"
dynamic = ["version"]
description = "可复现的金油比价历史统计与概率分析 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "XucroYuri" },
]
keywords = ["gold", "oil", "ratio", "statistics", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/XucroYuri/goratio"
Repository = "https://github.com/XucroYuri/goratio"
Issues = "https://github.com/XucroYuri/goratio/issues"
Documentation = "https://github.com/XucroYuri/goratio#readme"
Changelog = "https://github.com/XucroYuri/goratio/blob/main/CHANGELOG.md"

[project.scripts]
goratio = "goratio.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "goratio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
